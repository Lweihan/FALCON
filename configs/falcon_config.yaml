# FALCON 全局配置
# Flow matching in the Advertising scenarios based on Latent Clue Online policy distillatioN

seed: 42
output_dir: "./output"
device: "auto"

latent:
  embed_model_path: "Qwen/Qwen3-Embedding-0.6B"
  embed_dim: 256
  max_length: 512
  fusion_hidden_dim: 256
  fusion_output_dim: 256
  fusion_num_heads: 4
  fusion_dropout: 0.1

fm:
  data_dim: 256
  time_dim: 128
  cond_dim: 256
  hidden_dim: 512
  num_layers: 6
  dropout: 0.1
  epochs: 100
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  save_every: 10
  sample_steps: 100
  sample_method: "euler"

opd:
  student_model_path: "Qwen/Qwen3-8B"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  max_new_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  distill_alpha: 1.0
  distill_beta: 0.5
  distill_gamma: 0.1
  distill_tau: 2.0
  online_update_freq: 100
  replay_buffer_size: 10000
  ema_decay: 0.999
  epochs: 5
  batch_size: 4
  lr: 5.0e-5
  weight_decay: 1.0e-5
  grad_clip: 1.0
  warmup_steps: 100
  save_every: 1

scenario:
  data_path: ""
  max_users: -1
  train_ratio: 0.8
  num_workers: 0
  eval_metrics: ["cosine_sim", "mse", "ndcg"]
